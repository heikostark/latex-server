[package]
name = "latex-project-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors"] }
calamine = "0.24"
notify = "6"
tokio-stream = "0.1.19"

[profile.release]
opt-level = 2
