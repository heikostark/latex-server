[package]
name = "latex-project-server"
license = "MIT"
version = "0.21.0"
edition = "2021"
description = "A small Rust (Axum) web server that provides a single-page web interface for editing and compiling LaTeX projects."

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors"] }
calamine = "0.24"
notify = "6"
tokio-stream = "0.1.19"
include_dir = "0.7.4"
clap = { version = "4.0", features = ["derive"] }

[profile.release]
opt-level = 2
